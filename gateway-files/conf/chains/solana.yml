defaultNetwork: mainnet-beta

# Set this to your BackpackWallet Solana address after running: gateway connect solana
# Example: 7xW2abc...XYZ
#defaultWallet: '<your-backpack-wallet-address>'
defaultWallet: '6qKBYYRHPYbktDEDRXqwiSqMWxEUuXdvDj451PcyQY15'

# Optional: List of networks to query for balance operations
# If not specified, only defaultNetwork is used
defaultNetworks:
  - mainnet-beta

# RPC provider: 'url' uses nodeURL from network config, or specify a provider name (e.g., 'helius')
rpcProvider: url
